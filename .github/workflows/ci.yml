name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "uv==0.12.23"
      # 把 uv 项目环境放到仓库外（RUNNER_TEMP 由 runner 注入）：
      # 仓库内无 .venv 是约束门禁（test_no_project_level_venv）的检查对象。
      - run: UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/lifebase-ci-venv" uv sync --locked --extra dev
      - run: UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/lifebase-ci-venv" uv run --locked --extra dev ruff check .
      - run: UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/lifebase-ci-venv" uv run --locked --extra dev pytest
